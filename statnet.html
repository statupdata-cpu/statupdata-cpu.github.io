<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UGC NET Statistics — Materials</title>

<style>
body { margin:0; font-family:Arial; background:#eef3f5; }

.nav {
  display:flex;
  gap:20px;
  padding:15px 30px;
  background:#0f172a;
}
.nav a { color:white; text-decoration:none; font-weight:600; }

.wrap { max-width:1200px; margin:auto; padding:24px; }

.hero {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.filters {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.filters button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#ddd;
}

.filters button.active {
  background:#0ea5a4;
  color:#fff;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card {
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

.small { font-size:13px; color:#555; }

.btn {
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  background:linear-gradient(90deg,#00ffaa,#0ea5a4);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  margin:10px 0;
}

/* VIDEO */
.video-container {
  position: relative;
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
}

.video-container iframe {
  width:100%;
  height:100%;
  border:none;
}

/* ZOOM BUTTON */
.zoom-btn {
  position:absolute;
  top:8px;
  right:8px;
  background:rgba(0,0,0,0.7);
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
}

.hidden { display:none; }
</style>
</head>

<body>

<!-- NAV -->
<div class="nav">
  <a href="#">Home</a>
  <a href="#">Materials</a>
  <a href="#">Tests</a>
  <a href="#">Contact</a>
</div>

<div class="wrap">

<div class="hero">
  <h1>UGC NET Statistics — Study Materials</h1>
  <p class="small">Each set contains 50 MCQs with detailed explanation.</p>
</div>

<!-- FILTER -->
<div class="filters">
  <button onclick="filterUnit(event,'all')" class="active">All</button>
  <button onclick="filterUnit(event,'unit1')">Unit I</button>
  <button onclick="filterUnit(event,'unit2')">Unit II</button>
  <button onclick="filterUnit(event,'unit3')">Unit III</button>
  <button onclick="filterUnit(event,'unit4')">Unit IV</button>
  <button onclick="filterUnit(event,'unit5')">Unit V</button>
</div>

<div class="grid">

<!-- GENERATOR -->
<script>
function createCard(unitClass, title, desc){
  return `
  <div class="card ${unitClass}">
    <h3>${title}</h3>
    <p class="small">${desc}</p>
    <a class="btn" href="#">Download PDF</a>

    <div class="video-container">
      <iframe src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"
      allow="autoplay"></iframe>
      <button class="zoom-btn" onclick="openFullscreen(this)">⛶</button>
    </div>
  </div>`;
}

// UNIT 1
for(let i=1;i<=6;i++){
  document.write(createCard("unit1","Unit I — Set "+i,"Probability Theory (50 MCQs)"));
}

// UNIT 2
for(let i=1;i<=6;i++){
  document.write(createCard("unit2 hidden","Unit II — Set "+i,"Real Analysis & Matrix Algebra"));
}

// UNIT 3
for(let i=1;i<=6;i++){
  document.write(createCard("unit3 hidden","Unit III — Set "+i,"Sampling & DOE"));
}

// UNIT 4
for(let i=1;i<=6;i++){
  document.write(createCard("unit4 hidden","Unit IV — Set "+i,"Estimation Theory"));
}

// UNIT 5
for(let i=1;i<=6;i++){
  document.write(createCard("unit5 hidden","Unit V — Set "+i,"Hypothesis Testing"));
}
</script>

</div>
</div>

<script>
// FILTER FIX
function filterUnit(e, unit){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');

  document.querySelectorAll('.card').forEach(card=>{
    if(unit==='all'){
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
      if(card.classList.contains(unit)){
        card.classList.remove('hidden');
      }
    }
  });
}

// FULLSCREEN ZOOM
function openFullscreen(btn){
  const el = btn.parentElement;

  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}
</script>

</body>
</html>
