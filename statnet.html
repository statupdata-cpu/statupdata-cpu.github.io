<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UGC NET Statistics — Materials</title>

<style>
body { margin:0; font-family:Arial; background:#eef3f5; }

.nav {
  display:flex;
  gap:20px;
  padding:15px 30px;
  background:#0f172a;
}
.nav a {
  color:white;
  text-decoration:none;
  font-weight:600;
}

.wrap { max-width:1200px; margin:auto; padding:24px; }

.hero {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

.filters {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.filters button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#ddd;
}

.filters button.active {
  background:#0ea5a4;
  color:#fff;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:18px;
}

.card {
  background:#fff;
  padding:16px;
  border-radius:12px;
  box-shadow:0 10px 20px rgba(0,0,0,0.08);
}

.small { font-size:13px; color:#555; }

.btn {
  display:inline-block;
  padding:10px 14px;
  border-radius:8px;
  background:linear-gradient(90deg,#00ffaa,#0ea5a4);
  color:#fff;
  text-decoration:none;
  font-weight:600;
  margin:10px 0;
}

.video {
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:10px;
}

.hidden { display:none; }
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="nav">
  <a href="#">Home</a>
  <a href="#">Materials</a>
  <a href="#">Tests</a>
  <a href="#">Contact</a>
</div>

<div class="wrap">

<!-- HERO -->
<div class="hero">
  <h1>UGC NET Statistics — Study Materials</h1>
  <p class="small">Each set contains 50 MCQs with detailed explanation.</p>
</div>

<!-- FILTER -->
<div class="filters">
  <button onclick="filterUnit('all')" class="active">All</button>
  <button onclick="filterUnit('unit1')">Unit I</button>
  <button onclick="filterUnit('unit2')">Unit II</button>
  <button onclick="filterUnit('unit3')">Unit III</button>
  <button onclick="filterUnit('unit4')">Unit IV</button>
  <button onclick="filterUnit('unit5')">Unit V</button>
</div>

<!-- GRID -->
<div class="grid">

<!-- TEMPLATE: UNIT 1 (6 SETS) -->
<script>
for(let i=1;i<=6;i++){
document.write(`
<div class="card unit1">
  <h3>Unit I — Set ${i}</h3>
  <p class="small">Probability Theory (50 MCQs)</p>
  <a class="btn" href="#" target="_blank">Download PDF</a>
  <div class="video">
    <iframe width="100%" height="100%"
    src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"
    allow="autoplay"></iframe>
  </div>
</div>
`);
}
</script>

<!-- UNIT 2 -->
<script>
for(let i=1;i<=6;i++){
document.write(`
<div class="card unit2 hidden">
  <h3>Unit II — Set ${i}</h3>
  <p class="small">Real Analysis & Matrix Algebra</p>
  <a class="btn" href="#" target="_blank">Download PDF</a>
  <div class="video">
    <iframe width="100%" height="100%"
    src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"></iframe>
  </div>
</div>
`);
}
</script>

<!-- UNIT 3 -->
<script>
for(let i=1;i<=6;i++){
document.write(`
<div class="card unit3 hidden">
  <h3>Unit III — Set ${i}</h3>
  <p class="small">Sampling & DOE</p>
  <a class="btn" href="#">Download PDF</a>
  <div class="video">
    <iframe width="100%" height="100%"
    src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"></iframe>
  </div>
</div>
`);
}
</script>

<!-- UNIT 4 -->
<script>
for(let i=1;i<=6;i++){
document.write(`
<div class="card unit4 hidden">
  <h3>Unit IV — Set ${i}</h3>
  <p class="small">Estimation Theory</p>
  <a class="btn" href="#">Download PDF</a>
  <div class="video">
    <iframe width="100%" height="100%"
    src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"></iframe>
  </div>
</div>
`);
}
</script>

<!-- UNIT 5 -->
<script>
for(let i=1;i<=6;i++){
document.write(`
<div class="card unit5 hidden">
  <h3>Unit V — Set ${i}</h3>
  <p class="small">Hypothesis Testing</p>
  <a class="btn" href="#">Download PDF</a>
  <div class="video">
    <iframe width="100%" height="100%"
    src="https://drive.google.com/file/d/1mhLYwOINP4oht8s40jtfBJum16nbS2zz/preview"></iframe>
  </div>
</div>
`);
}
</script>

</div>
</div>

<script>
function filterUnit(unit){
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  event.target.classList.add('active');

  document.querySelectorAll('.card').forEach(card=>{
    if(unit==='all'){
      card.classList.remove('hidden');
    } else {
      card.classList.add('hidden');
      if(card.classList.contains(unit)){
        card.classList.remove('hidden');
      }
    }
  });
}
</script>

</body>
</html>
